version: '3.8'

services:
  # Backend API service
  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: music-streaming-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=music_streaming_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=your_jwt_secret
      - JWT_REFRESH_SECRET=your_jwt_refresh_secret
      - JWT_RESET_SECRET=your_jwt_reset_secret

  # PostgreSQL database
  postgres:
    image: postgres:13-alpine
    container_name: music-streaming-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=music_streaming_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for caching and real-time features
  redis:
    image: redis:6-alpine
    container_name: music-streaming-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Frontend service (to be implemented)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: ../docker/frontend/Dockerfile
  #   container_name: music-streaming-frontend
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: music-streaming-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  uploads:
  pgadmin_data: